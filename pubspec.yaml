name: naitri_app
description: Naitri — handset loan customer app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                        # lightweight networking
  shared_preferences: ^2.2.0          # token cache
  image_picker: ^1.0.7                # camera for selfies
  intl: ^0.19.0                       # number/date formatting
  mobile_scanner: ^5.2.3              # Scan QR to pay
  flutter_local_notifications: ^17.2.0 # EMI reminders (on-device)
  timezone: ^0.9.4                    # scheduling for notifications
  path_provider: ^2.1.0               # save downloaded statement
  share_plus: ^10.0.0                 # share/open statement
  razorpay_flutter: ^1.3.7            # Razorpay Checkout
  url_launcher: ^6.2.5                # open razorpay.me link fallback

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
